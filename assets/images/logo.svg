<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" class="campuspark-logo">
  <defs>
    <linearGradient id="cpGradBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cpGradP" x1="16" y1="12" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cpGradPin" x1="28" y1="18" x2="36" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="cpGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B0F17" stroke="url(#cpGradBorder)" stroke-width="1.5"/>

  <!-- Isometric Parking Space Ground Grid -->
  <path d="M12 40 L32 50 L52 40 L32 30 Z" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  
  <!-- Isometric 3D "P" Stem and Loop -->
  <g filter="url(#cpGlow)">
    <!-- P Vertical Stem 3D Face -->
    <path d="M20 14 L24 16 L24 46 L20 44 Z" fill="#0E7490"/>
    <path d="M24 16 L29 18.5 L29 48.5 L24 46 Z" fill="#155E75"/>
    <path d="M20 14 L29 18.5 L29 23 L20 18.5 Z" fill="#38BDF8"/>

    <!-- P Loop Front & Outer Contour -->
    <path d="M29 18.5 C36 15 47 18 47 27 C47 34 38 38.5 29 35" stroke="url(#cpGradP)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M20 14 L20 44" stroke="url(#cpGradP)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Central Location Waypoint Pin -->
    <path d="M37 21 C34.5 21 32.5 23 32.5 25.5 C32.5 28.5 37 34 37 34 C37 34 41.5 28.5 41.5 25.5 C41.5 23 39.5 21 37 21 Z" fill="url(#cpGradPin)"/>
    <circle cx="37" cy="25.5" r="1.5" fill="#0B0F17"/>
  </g>
</svg>
